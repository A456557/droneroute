services:
  traefik:
    image: traefik:v3.6
    container_name: droneroute-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  droneroute:
    image: fcsonline/droneroute:latest
    # To build from source instead, comment out "image" above and uncomment:
    # build:
    #   context: .
    #   args:
    #     COMMIT_SHA: ${COMMIT_SHA:-dev}
    container_name: droneroute
    volumes:
      - droneroute-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3001}
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - DB_PATH=${DB_PATH:-/app/data/droneroute.db}
      - SELF_HOSTED=${SELF_HOSTED:-true}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - GITHUB_MODELS_TOKEN=${GITHUB_MODELS_TOKEN:-}
      - GITHUB_MODELS_MODEL=${GITHUB_MODELS_MODEL:-}
      - GITHUB_MODELS_ENDPOINT=${GITHUB_MODELS_ENDPOINT:-}
      - GITHUB_MODELS_API_VERSION=${GITHUB_MODELS_API_VERSION:-}
      - AI_API_URL=${AI_API_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      # Terrain chantier open-source (MNT IGN, Licence Ouverte).
      - IGN_ALTIMETRIE_RESOURCE=${IGN_ALTIMETRIE_RESOURCE:-ign_rge_alti_wld}
      - IGN_ALTIMETRIE_BASE=${IGN_ALTIMETRIE_BASE:-}
      - DEFAULT_MAP_VIEW=${DEFAULT_MAP_VIEW:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      # Default map view on load (optional). Format: "lat,lng" or "lat,lng,zoom".
      # - DEFAULT_MAP_VIEW=41.3874,2.1686,13
      # IA locale open-source (Ollama + Mistral) : décommentez pour activer.
      # Voir https://ollama.com — puis : ollama pull mistral
      # - AI_PROVIDER=ollama
      # - AI_API_URL=http://ollama:11434/v1/chat/completions
      # - AI_MODEL=mistral:latest
    # Service IA locale (optionnel, profil ollama) :
    #   docker compose --profile ollama up -d
    # ollama:
    #   image: ollama/ollama:latest
    #   container_name: droneroute-ollama
    #   profiles: ["ollama"]
    #   volumes:
    #     - ollama-data:/root/.ollama
    #   restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.droneroute.rule=Host(`droneroute.localhost`)"
      - "traefik.http.routers.droneroute.entrypoints=web"
      - "traefik.http.services.droneroute.loadbalancer.server.port=3001"
    restart: unless-stopped

volumes:
  droneroute-data:
  # ollama-data:
